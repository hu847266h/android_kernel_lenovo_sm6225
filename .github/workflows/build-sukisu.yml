name: Build SukiSU Kernel (TB128FU)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi flex bison bc libssl-dev lld

      - name: Apply SukiSU (non-GKI)
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Fix config for newer toolchain
        run: |
          sed -i 's/^CONFIG_USB_NET_AX8817X=y/# CONFIG_USB_NET_AX8817X is not set/' arch/arm64/configs/tb128fu_defconfig
          sed -i 's/^CONFIG_USB_NET_AX88179_178A=y/# CONFIG_USB_NET_AX88179_178A is not set/' arch/arm64/configs/tb128fu_defconfig
          sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' arch/arm64/configs/tb128fu_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            tb128fu_defconfig
          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            olddefconfig
          make O=out ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j$(nproc)

      - name: List build output
        run: ls -la out/arch/arm64/boot/

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz
          path: out/arch/arm64/boot/Image*
          if-no-files-found: error
